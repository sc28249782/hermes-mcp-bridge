name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          severity: warning
      - name: Migration test with shutdown warning gate
        shell: bash
        run: |
          set -euo pipefail
          python -X tracemalloc=10 -W error::ResourceWarning -B -m unittest discover -s tests -p test_bridge.py -k test_existing_database_migrates -v 2>&1 | tee "$RUNNER_TEMP/migration.log"
          if grep -En 'ResourceWarning:|Exception ignored while finalizing database' "$RUNNER_TEMP/migration.log"; then exit 1; else test "$?" -eq 1; fi
      - name: Full suite with shutdown warning gate
        shell: bash
        run: |
          set -euo pipefail
          python -W error::ResourceWarning -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/tests.log"
          if grep -En 'ResourceWarning:|Exception ignored while finalizing database' "$RUNNER_TEMP/tests.log"; then exit 1; else test "$?" -eq 1; fi
      - run: bash -n install.sh bridge.sh tunnel.sh
