name: OpenCode B4 offline supervision controls

on:
  pull_request:
    branches: [main]
    paths: ['acceptance/handoff/opencode/**', 'docs/OPENCODE-HANDOFF-*.md', '.github/workflows/opencode_supervision_source.yml']

permissions:
  contents: read

jobs:
  supervision:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run owned B4 process controls only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          umask 022
          b4_log="$RUNNER_TEMP/opencode-b4.log"
          set +e
          python -W error::ResourceWarning -I -S -B acceptance/handoff/opencode/test_supervision.py > "$b4_log" 2>&1
          b4_exit=$?
          set -e
          cat "$b4_log"
          python -I -S -B - "$b4_log" "$b4_exit" <<'PY'
          from pathlib import Path
          import json,re,sys
          raw=Path(sys.argv[1]).read_bytes()
          markers=[m.decode() for m in (b'ResourceWarning',b'Exception ignored',b'Traceback') if m in raw]
          complete=(re.findall(rb'^Ran (\d+) tests? in ',raw,re.M)==[b'29']
                    and re.search(rb'^OK\s*$',raw,re.M) is not None
                    and re.search(rb'\bskipped\b',raw,re.I) is None)
          print(json.dumps({'b4_exit':int(sys.argv[2]),'complete_without_skips':complete,
                            'warning_markers':markers,'dev_observed':False,'authorizes_actions':False}))
          assert sys.argv[2]=='0' and complete and not markers,'B4 controls failed'
          PY
